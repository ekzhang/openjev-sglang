[project]
name = "openjev-sglang"
version = "0.1.0"
description = "Jev-compatible classification from one-token SGLang logprobs"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "huggingface-hub>=1,<2",
  "jinja2>=3.1.6,<4",
  "orjson>=3.10,<4",
  "pydantic-settings>=2.8,<3",
  "transformers>=5.3,<6",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
openjev = "openjev.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openjev"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1"]
deploy = ["modal>=1.1,<2"]

[tool.uv]
default-groups = ["dev", "deploy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: downloads the real Qwen tokenizer; no GPU required"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
